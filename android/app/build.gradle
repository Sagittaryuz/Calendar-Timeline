plugins { id 'com.android.application' }
android {
    namespace 'com.sagittaryuz.calendartimeline'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'com.sagittaryuz.calendartimeline'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.6.0-providers-preview'
        buildConfigField 'boolean', 'GOOGLE_TASKS_CONFIGURED', providers.gradleProperty('calendarGoogleOAuthConfigured').getOrElse('false') == 'true' ? 'true' : 'false'
        def microsoftId = providers.gradleProperty('calendarMicrosoftClientId').getOrElse('')
        if (microsoftId && !(microsoftId ==~ /[a-fA-F0-9-]{36}/)) throw new GradleException('Invalid Microsoft public client ID')
        buildConfigField 'String', 'MICROSOFT_CLIENT_ID', '"' + microsoftId + '"'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { signingConfig null } }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.microsoft.identity.client:msal:8.5.0'
}
tasks.register('syncScriptableRenderer', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'tools/build-android-renderer.cjs'
    inputs.file rootProject.file('../Calendar Timeline')
    inputs.file rootProject.file('../tools/build-android-renderer.cjs')
    inputs.dir rootProject.file('renderer')
    outputs.dir project.file('src/main/assets')
}
preBuild.dependsOn 'syncScriptableRenderer'
